name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# To redeploy, re-run all jobs in the push CI run for the current main commit.
# This produces a fresh artifact for that attempt and repeats every required check.

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/ci.yml'
    runs-on: ubuntu-latest
    # Check main while holding the deployment slot: CI completions can arrive late.
    # Keep in-flight deployments serialized so an older run cannot replace a newer one.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the tested web app from the triggering CI attempt
        uses: actions/download-artifact@v8
        with:
          name: web-app-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/web-app
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          digest-mismatch: error

      - name: Package the tested files for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-app
          include-hidden-files: true

      - name: Verify CI still passed for the current main commit
        id: verified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # A manual re-run of this deployment must also revalidate its source CI run.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/ci-run.json"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$CI_HEAD_SHA" \
            --argjson attempt "$CI_RUN_ATTEMPT" \
            '.status == "completed" and .conclusion == "success" and
             .event == "push" and .head_branch == "main" and
             .head_repository.full_name == $repository and
             .path == ".github/workflows/ci.yml" and
             .head_sha == $sha and .run_attempt == $attempt' \
            "$RUNNER_TEMP/ci-run.json" > /dev/null

          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$MAIN_SHA" != "$CI_HEAD_SHA" ]; then
            echo "::notice::Skipping deployment: the tested commit is no longer the head of main."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - id: deployment
        if: steps.verified.outputs.current == 'true'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
