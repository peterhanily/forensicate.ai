name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @forensicate/app lint

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=high

  test-scanner:
    name: Test Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @forensicate/scanner test

      - run: pnpm --filter @forensicate/scanner build

      - run: pnpm --filter @forensicate/github-action test

  test-app:
    name: Test App
    runs-on: ubuntu-latest
    needs: [test-scanner]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @forensicate/scanner build

      - run: pnpm --filter @forensicate/app test

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    needs: [test-scanner]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @forensicate/scanner build

      - run: pnpm --filter @forensicate/api test:ci

  test-extension:
    name: Test Extension
    runs-on: ubuntu-latest
    needs: [test-scanner]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @forensicate/scanner build

      - run: pnpm --filter @forensicate/extension test

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @forensicate/scanner build

      - run: pnpm --filter @forensicate/app exec tsc -b

      - run: pnpm --filter @forensicate/api type-check

      - run: pnpm --filter forensicate-vscode lint

      - run: pnpm --filter forensicate-vscode test

  test-python:
    name: Test Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest packages/python/tests

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, security, test-app, test-api, test-extension, test-python, typecheck]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build scanner
        run: pnpm --filter @forensicate/scanner build

      - name: Build web app for GitHub Pages
        # test-app already passed for this commit through this job's needs.
        run: pnpm --filter @forensicate/app build:gh-pages:only

      - name: Check bundle size
        run: |
          # Check total JS bundle size (budget: 2MB — compromise.js NLP alone is ~800KB)
          TOTAL_JS=$(find packages/app/dist/assets -name '*.js' -exec wc -c {} + | tail -1 | awk '{print $1}')
          BUDGET=2097152
          echo "Total JS size: ${TOTAL_JS} bytes (budget: ${BUDGET} bytes)"
          if [ "$TOTAL_JS" -gt "$BUDGET" ]; then
            echo "::error::Bundle size ${TOTAL_JS} exceeds budget ${BUDGET}"
            exit 1
          fi
          echo "✅ Bundle size within budget"

      - name: Build extensions (Chrome + Firefox)
        run: pnpm --filter @forensicate/extension build:all

      - name: Build VS Code extension
        run: pnpm --filter forensicate-vscode build

      - name: Build API (dry run)
        run: pnpm build:api

      - name: Verify rule counts
        run: pnpm verify:rules

      - name: Upload web app artifact
        uses: actions/upload-artifact@v7
        with:
          # A re-run must publish its own tested build, never reuse an older attempt.
          name: web-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/app/dist/
          # Keep .well-known/security.txt in the published site.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload Chrome extension
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension
          path: packages/extension/dist/chrome/
          retention-days: 7

      - name: Upload Firefox extension
        uses: actions/upload-artifact@v7
        with:
          name: firefox-extension
          path: packages/extension/dist/firefox/
          retention-days: 7
