name: Pricing Data Check

on:
  schedule:
    - cron: '0 9 1 * *'  # Monthly on the 1st at 9am UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-pricing:
    name: Check Pricing Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check pricing age
        id: check
        run: |
          # Freshness comes from each verified entry; PRICING_LAST_UPDATED dates unverified historical data.
          OLDEST_VERIFIED=$(grep -oP "verifiedAt: '\K[^']+" packages/app/src/lib/pricing/pricingDatabase.ts | sort | head -n 1)
          if [ -z "$OLDEST_VERIFIED" ]; then
            echo "::error::No verifiedAt dates found in the pricing database"
            exit 1
          fi
          LAST_EPOCH=$(date -d "$OLDEST_VERIFIED" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$OLDEST_VERIFIED" +%s)
          NOW_EPOCH=$(date +%s)
          AGE_DAYS=$(( (NOW_EPOCH - LAST_EPOCH) / 86400 ))
          echo "age_days=$AGE_DAYS" >> $GITHUB_OUTPUT
          echo "Oldest verified pricing is ${AGE_DAYS} days old (verified: ${OLDEST_VERIFIED})"
          if [ "$AGE_DAYS" -gt 30 ]; then
            echo "stale=true" >> $GITHUB_OUTPUT
          else
            echo "stale=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue if stale
        if: steps.check.outputs.stale == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'pricing-stale',
              state: 'open'
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Pricing data is stale (>30 days old)',
                body: `The oldest verified price in \`packages/app/src/lib/pricing/pricingDatabase.ts\` was checked **${{ steps.check.outputs.age_days }} days ago**.\n\nPlease re-check the verified entries against official provider pricing pages and update each entry's \`source.verifiedAt\`. Do not change \`PRICING_LAST_UPDATED\`; it dates the unverified historical fallback data.`,
                labels: ['pricing-stale', 'maintenance']
              });
            }
