name: 'Forensicate.ai Prompt Injection Scanner'
description: 'Scan files and PR diffs for prompt injection attacks, jailbreaks, and hidden payloads'
author: 'Forensicate.ai'
branding:
  icon: 'shield'
  color: 'yellow'

inputs:
  paths:
    description: 'Glob patterns to scan (space-separated). Default scans changed files in PR.'
    required: false
    default: ''
  confidence-threshold:
    description: 'Minimum confidence percentage to report (0-100)'
    required: false
    default: ''
  fail-on-finding:
    description: 'Fail the action if injection is detected'
    required: false
    default: ''
  scan-mode:
    description: 'What to scan: "changed" (PR diff only), "all" (all matching files)'
    required: false
    default: ''
  comment-on-pr:
    description: 'Post scan results as a PR comment (requires github-token)'
    required: false
    default: 'true'
  sarif-upload:
    description: 'Generate SARIF report and upload to GitHub Security tab'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for PR comments and SARIF upload (defaults to GITHUB_TOKEN)'
    required: false
    default: ${{ github.token }}

outputs:
  findings-count:
    description: 'Number of files with detected injections'
    value: ${{ steps.scan.outputs.findings-count }}
  total-files-scanned:
    description: 'Total number of files scanned'
    value: ${{ steps.scan.outputs.total-files-scanned }}
  max-confidence:
    description: 'Highest confidence score found'
    value: ${{ steps.scan.outputs.max-confidence }}
  sarif-file:
    description: 'Path to generated SARIF file (when sarif-upload is enabled)'
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10.29.1
        package_json_file: ${{ github.action_path }}/../../package.json

    - name: Build scanner from action source
      shell: bash
      run: |
        pnpm install --filter @forensicate/scanner... --frozen-lockfile --ignore-scripts
        pnpm --filter @forensicate/scanner build
      working-directory: ${{ github.action_path }}/../..

    - name: Run scan
      id: scan
      shell: bash
      run: node "$FORENSICATE_ACTION_PATH/scan.mjs"
      env:
        FORENSICATE_ACTION_PATH: ${{ github.action_path }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_CONFIDENCE_THRESHOLD: ${{ inputs.confidence-threshold }}
        INPUT_FAIL_ON_FINDING: ${{ inputs.fail-on-finding }}
        INPUT_SCAN_MODE: ${{ inputs.scan-mode }}
        INPUT_COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
        INPUT_SARIF_UPLOAD: ${{ inputs.sarif-upload }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Upload SARIF to GitHub Security
      if: always() && steps.scan.outputs.sarif-file != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: forensicate-ai
      continue-on-error: true
